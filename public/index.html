<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Credifama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12 text-center mb-3">
                <img src="logo.png" alt="Credifama" class="logo-principal">
            </div>
        </div>
        <div class="row">
            <div class="col-12 col-md-6 col-ingreso">
                <div class="card tarjeta-panel">
                    <form id="formulario-ingreso" novalidate>
                        <div class="card-body">
                            <div id="ingreso-datos">
                                <h5 class="card-title titulo-tarjeta">Ingreso de Datos</h5>
                                <div class="mb-3 row">
                                    <label for="nombre" class="col-md-3 col-form-label form-label-custom">Nombre</label>
                                    <div class="col-md-9">
                                        <input type="text" id="nombre" class="form-control" name="nombre"
                                            placeholder="tu-nombre">
                                        <div id="nombre-feedback" class="invalid-feedback"></div>
                                    </div>
                                </div>
                                <div class="mb-3 row">
                                    <label for="email" class="col-md-3 col-form-label form-label-custom">Email</label>
                                    <div class="col-md-9">
                                        <input type="email" id="email" class="form-control" name="email"
                                            placeholder="tu-email@gmail.com">
                                        <div id="email-feedback" class="invalid-feedback"></div>
                                    </div>
                                </div>
                                <div class="mb-3 row">
                                    <label for="telefono"
                                        class="col-md-3 col-form-label form-label-custom">Teléfono</label>
                                    <div class="col-md-9">
                                        <input type="tel" id="telefono" class="form-control" name="telefono"
                                            maxlength="9" placeholder="09XXXXXXX">
                                        <div id="telefono-feedback" class="invalid-feedback"></div>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-9 offset-md-3 text-end">
                                        <button type="submit" class="btn btn-primary btn-enviar">Enviar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lista">
                <div class="card tarjeta-panel">
                    <div class="card-body">
                        <div id="lista-datos">
                            <h5 class="card-title titulo-tarjeta">Listado de datos</h5>
                            <div id="lista-usuarios">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
        <script src="js/app.js"></script>
</body>

</html>
